<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <script>(function(){var ua=navigator.userAgent||"",ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);if(!ios)return;var m=document.querySelector('meta[name="viewport"]');if(m)m.setAttribute("content","width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover")})();</script>
  <meta name="theme-color" content="#123f6d">
  <meta name="description" content="SCaD Gestión · Seguimiento de proyectos y expediente técnico">
  <title>SCaD Gestión</title>
  <link rel="manifest" href="./manifest.json?v=0.5.4">
  <link rel="icon" type="image/png" href="./assets/branding/scad-gestion-icono.png">
  <link rel="apple-touch-icon" href="./assets/branding/scad-gestion-icono.png">
  <script>window.__gestionInstallPrompt=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__gestionInstallPrompt=e;});window.addEventListener("appinstalled",function(){window.__gestionInstallPrompt=null;});</script>
  <link rel="stylesheet" href="./css/gestion.css?v=0.7.1">

  <style>
    .app-splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#fff;opacity:1;transition:opacity .65s ease;pointer-events:auto}
    .app-splash img{display:block;width:min(76vw,340px);max-height:70dvh;object-fit:contain;transform:scale(1);transition:transform .65s cubic-bezier(.2,.65,.3,1),opacity .65s ease}
    .app-splash.is-leaving{opacity:0;pointer-events:none}.app-splash.is-leaving img{transform:scale(1.16);opacity:0}
    @media(prefers-reduced-motion:reduce){.app-splash,.app-splash img{transition:opacity .15s linear}.app-splash.is-leaving img{transform:none}}
  </style>
</head>
<body>
  <div id="appSplash" class="app-splash" aria-hidden="true"><img src="./assets/branding/scad-gestion-completo.png" alt="" fetchpriority="high"><span class="splash-ver" id="splashVer"></span></div>
  <script src="./js/inicio.js"></script>
  <header class="topbar">
    <div class="brand">
      <a class="brand-home" href="#/inicio" aria-label="SCaD GESTIÓN · Inicio"><img src="./assets/branding/scad-gestion-compacto.png" alt="SCaD GESTIÓN" class="logo"></a>
      <div class="brand-context"><span class="brand-label">ESPACIO DE TRABAJO</span><span id="eoName"></span><span id="modoTxt" class="brand-modo" hidden></span></div>
    </div>
    <div class="top-actions">
      <button id="btnLoginTop" class="btn pri sm" type="button" hidden>Iniciar sesión</button>
      <button id="installButton" class="install-button" type="button" hidden>Instalar app</button>
      <button id="account" class="account-trigger" type="button" hidden aria-label="Abrir menú de cuenta" aria-controls="accountMenu" aria-expanded="false">
        <span id="topAvatar" class="avatar">U</span><span id="topName" class="account-name"></span><span class="chev" aria-hidden="true">⌄</span>
      </button>
    </div>
    <aside id="accountMenu" class="account-menu" aria-label="Opciones de cuenta" hidden>
      <div class="options-heading"><strong>Opciones</strong><button type="button" id="closeOptions" aria-label="Cerrar opciones">×</button></div>
      <div class="menu-id">
        <span id="menuAvatar" class="avatar lg">U</span>
        <div><strong id="menuName"></strong><span id="menuEmail"></span></div>
      </div>
      <div id="menuModos" class="menu-modos" hidden></div>
      <nav class="menu-acts">
        <button type="button" data-menu="refresh">Actualizar</button>
        <button type="button" data-menu="perfil">Editar perfil</button>
        <button type="button" data-menu="panel" id="btnPanel" hidden>Panel de Control</button>
        <button type="button" data-menu="privacidad">Política de privacidad</button>
        <button type="button" data-menu="condiciones">Condiciones del servicio</button>
        <button type="button" data-menu="logout" class="danger">Cerrar sesión</button>
      </nav>
    </aside>
  </header>
  <div id="modeBand" class="mode-band" hidden></div>
  <nav id="secciones" class="secciones" aria-label="Navegación principal" hidden><a href="#/" data-sec="proyectos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/><path d="M3 11h18"/></svg><span>Proyectos</span></a><a href="#/programacion" data-sec="programacion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 11h18M8 15h2M14 15h2"/></svg><span>Programación</span></a><button id="navOptions" type="button" aria-controls="accountMenu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="#123f6d"/><circle cx="16" cy="12" r="2" fill="#123f6d"/><circle cx="10" cy="18" r="2" fill="#123f6d"/></svg><span>Opciones</span></button></nav>

  <div id="driveWarn" class="drive-warn" hidden>El Drive de la EO no está conectado: por ahora no se pueden subir documentos.</div>

  <main>
    <div id="gate" class="gate"></div>
    <div id="view"></div>
  </main>

  <dialog id="dlg"><button type="button" class="dlg-x" data-dlg="cerrar" aria-label="Cerrar">×</button><div id="dlgBody"></div></dialog>
  <div id="toast" class="toast" hidden></div>
  <div id="busy" class="busy" hidden role="status" aria-live="polite"><div class="busy-card"><div class="spinner"></div><span id="busyText">Procesando solicitud…</span><span class="busy-sub">Espera a que termine la operación.</span></div></div>
  <footer class="ver" id="ver"></footer>

  <script type="module" src="./js/app.js?v=0.6.0"></script>
</body>
</html>
