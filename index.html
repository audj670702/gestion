<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <script>(function(){var ua=navigator.userAgent||"",ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);if(!ios)return;var m=document.querySelector('meta[name="viewport"]');if(m)m.setAttribute("content","width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover")})();</script>
  <meta name="theme-color" content="#15253d">
  <meta name="description" content="SCaD Gestión · Seguimiento de proyectos y expediente técnico">
  <title>SCaD Gestión</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <script>window.__gestionInstallPrompt=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__gestionInstallPrompt=e;});window.addEventListener("appinstalled",function(){window.__gestionInstallPrompt=null;});</script>
  <link rel="stylesheet" href="./css/gestion.css?v=0.5.0">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="./assets/icon-192.png" alt="" class="logo">
      <div><strong>SCaD Gestión</strong><span id="eoName"></span></div>
    </div>
    <div class="top-actions">
      <button id="installButton" class="install-button" type="button" hidden>Instalar app</button>
      <button id="account" class="account-trigger" type="button" hidden aria-label="Abrir menú de cuenta" aria-expanded="false">
        <span id="topAvatar" class="avatar">U</span><span id="topName" class="account-name"></span><span class="chev" aria-hidden="true">⌄</span>
      </button>
    </div>
    <aside id="accountMenu" class="account-menu" hidden>
      <div class="menu-id">
        <span id="menuAvatar" class="avatar lg">U</span>
        <div><strong id="menuName"></strong><span id="menuEmail"></span></div>
      </div>
      <div id="menuModos" class="menu-modos" hidden></div>
      <nav class="menu-acts">
        <button type="button" data-menu="refresh">Actualizar</button>
        <button type="button" data-menu="perfil">Editar perfil</button>
        <button type="button" data-menu="panel" id="btnPanel" hidden>Panel de Control</button>
        <button type="button" data-menu="logout" class="danger">Cerrar sesión</button>
      </nav>
    </aside>
  </header>
  <div id="modeBand" class="mode-band" hidden></div>
  <nav id="secciones" class="secciones" hidden><a href="#/" data-sec="proyectos">Proyectos</a><a href="#/programacion" data-sec="programacion">Programación</a></nav>

  <div id="driveWarn" class="drive-warn" hidden>El Drive de la EO no está conectado: por ahora no se pueden subir documentos.</div>

  <main>
    <div id="gate" class="gate"></div>
    <div id="view"></div>
  </main>

  <dialog id="dlg"><div id="dlgBody"></div></dialog>
  <div id="toast" class="toast" hidden></div>
  <div id="busy" class="busy" hidden><div class="spinner"></div></div>
  <footer class="ver" id="ver"></footer>

  <script type="module" src="./js/app.js?v=0.5.0"></script>
</body>
</html>
